services:
  tally:
    build: .
    container_name: tally
    restart: unless-stopped
    environment:
      # Optional: ask for a password once per device. Leave empty to turn it off.
      APP_PASSWORD: ${TALLY_PASSWORD:-}
    volumes:
      - tally-data:/data
    networks:
      - cloudflare_tunnel

volumes:
  tally-data:

networks:
  cloudflare_tunnel:
    external: true
    name: jrapp-remote-access_default
