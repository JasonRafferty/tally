services:
  checklist:
    build: .
    container_name: checklist
    restart: unless-stopped
    environment:
      # Optional: ask for a password once per device. Leave empty to turn it off.
      APP_PASSWORD: ${CHECKLIST_PASSWORD:-}
    volumes:
      - checklist-data:/data
    networks:
      - cloudflare_tunnel

volumes:
  checklist-data:

networks:
  cloudflare_tunnel:
    external: true
    name: jrapp-remote-access_default
