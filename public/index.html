<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9edf2" />
    <title>Tally</title>
    <!-- icon for tabs, bookmarks and "Add to Home Screen" -->
    <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tally" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=12" />
  </head>
  <body data-view="home">
    <main class="shell">
      <div id="top-sentinel" aria-hidden="true"></div>
      <header class="top">
        <span class="top-bar" aria-hidden="true"><span id="top-bar"></span></span>
        <button type="button" class="round back" data-go-home aria-label="All lists">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
        </button>
        <div class="title">
          <h1 id="title">Lists</h1>
          <p class="status" id="status" data-state="checking">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-text" id="status-text">Loading</span>
          </p>
        </div>
        <div class="seg" role="radiogroup" aria-label="Which lists to show">
          <span class="seg-pill" aria-hidden="true"></span>
          <button type="button" role="radio" data-set-view="todo" aria-checked="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 2 2 3-3.5M4 17l2 2 3-3.5M13 7.5h7M13 17.5h7" /></svg>
            To-do
          </button>
          <button type="button" role="radio" data-set-view="shopping" aria-checked="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2 11h10.2l2-8H6.6" /><circle cx="9" cy="19.5" r="1.3" /><circle cx="17" cy="19.5" r="1.3" /></svg>
            Shopping
          </button>
        </div>
        <button type="button" class="round more" data-list-menu aria-label="List options">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="19" cy="12" r="1.4" /></svg>
        </button>
      </header>

      <div id="home-content">
      <!-- lists shared with the other person: cards that show the latest change -->
      <section class="together-wrap" id="together-wrap" hidden>
        <p class="label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.4 4.5c2.2 0 3.9 1.2 5.6 3.3 1.7-2.1 3.4-3.3 5.6-3.3 3.4 0 5.5 3.5 4 7.1C19.5 16.4 12 21 12 21z" /></svg>Together</p>
        <div id="together" aria-live="polite"></div>
        <p class="label mine">Mine</p>
      </section>

      <!-- my lists: tiles rendered by app.js -->
      <section class="grid" id="lists" aria-live="polite"></section>
      </div>
      <footer class="who-line" id="who-line"></footer>

      <!-- one list -->
      <section class="list" id="list">
        <div class="add-wrap">
          <form class="add" id="add-form" autocomplete="off">
            <span class="add-plus" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></span>
            <input id="add-input" name="text" maxlength="500" placeholder="Add an item" aria-label="New item" enterkeyhint="done" />
            <button type="submit" class="add-go" aria-label="Add">Add</button>
          </form>
          <!-- shopping lists: things you've bought before -->
          <div class="suggest" id="suggest" role="group" aria-label="Suggestions" hidden></div>
        </div>
        <ul class="items" id="todo" aria-label="To do"></ul>
        <p class="empty" id="empty"></p>
        <div class="done-head" id="done-head" data-flip="done-head">
          <button type="button" class="done-toggle" id="done-toggle" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            <span id="done-count">Done</span>
          </button>
          <button type="button" class="chip" data-clear-done>Clear done</button>
        </div>
        <ul class="items done" id="done" aria-label="Done"></ul>
      </section>
    </main>

    <!-- sign in (only when the server has a password) -->
    <dialog class="sheet" id="login-sheet" aria-labelledby="login-title">
      <form method="dialog" class="sheet-panel" id="login-form">
        <h2 id="login-title">Tally</h2>
        <p class="sheet-note">Enter the password to open your lists.</p>
        <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required />
        <p class="sheet-error" id="login-error" role="alert"></p>
        <div class="sheet-actions"><button type="submit" class="primary">Open</button></div>
      </form>
    </dialog>

    <!-- first launch on a phone: who is this? -->
    <dialog class="sheet" id="who-sheet" aria-labelledby="who-title">
      <div class="sheet-panel">
        <h2 id="who-title">Who’s this?</h2>
        <p class="sheet-note">Your lists stay on your phone. Lists you share show on both.</p>
        <div class="who-choices">
          <button type="button" class="who-btn" data-who="jason"><span class="person j">J</span>Jason</button>
          <button type="button" class="who-btn" data-who="wah"><span class="person w">W</span>Wah</button>
        </div>
      </div>
    </dialog>

    <!-- name a list, rename a list or edit an item -->
    <dialog class="sheet" id="edit-sheet" aria-labelledby="edit-title">
      <form method="dialog" class="sheet-panel" id="edit-form" autocomplete="off">
        <h2 id="edit-title"></h2>
        <input name="text" maxlength="500" aria-labelledby="edit-title" enterkeyhint="done" required />
        <input name="qty" id="edit-qty" maxlength="40" placeholder="Quantity, e.g. 2 or 500 g" aria-label="Quantity" enterkeyhint="done" hidden />
        <select name="grp" id="edit-grp" aria-label="Group" hidden></select>
        <!-- list options only: colour and pin -->
        <div class="swatches" id="swatches" role="radiogroup" aria-label="Colour"></div>
        <button type="button" class="pin-toggle" id="pin-toggle" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3z" /><path d="M12 14v6" /></svg>
          <span><b>Pin to the top</b><small>Shows first, as a big tile, on this device</small></span>
          <span class="switch" aria-hidden="true"></span>
        </button>
        <button type="button" class="pin-toggle" id="share-toggle" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.4 4.5c2.2 0 3.9 1.2 5.6 3.3 1.7-2.1 3.4-3.3 5.6-3.3 3.4 0 5.5 3.5 4 7.1C19.5 16.4 12 21 12 21z" /></svg>
          <span><b id="share-title">Share</b><small>Shows on both phones, under Together</small></span>
          <span class="switch" aria-hidden="true"></span>
        </button>
        <div class="sheet-actions">
          <button type="button" class="danger" data-sheet-delete>Delete</button>
          <button type="button" class="plain" data-sheet-cancel>Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <!-- "Install Tally" prompt on phones -->
    <aside class="install" id="install" aria-label="Install the app" hidden>
      <img src="assets/icon-192.png" alt="" width="44" height="44" />
      <div class="install-copy">
        <b>Install Tally</b>
        <small id="install-note">Open it from your home screen like an app</small>
      </div>
      <button type="button" class="primary" id="install-go">Install</button>
      <button type="button" class="install-close" id="install-close" aria-label="Not now">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </aside>

    <!-- after holding a list: act on every selected list at once -->
    <div class="select-bar" id="select-bar" role="toolbar" aria-label="Selected lists" hidden>
      <button type="button" class="plain" data-select-cancel>Cancel</button>
      <button type="button" class="plain" data-select-pin>Pin</button>
      <button type="button" class="plain" data-select-edit>Edit</button>
      <button type="button" class="danger" data-select-delete>Delete</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-undo" hidden>Undo</button></div>
    <script src="groups.js?v=1"></script>
    <script src="icons.js?v=1"></script>
    <script src="app.js?v=14"></script>
  </body>
</html>
